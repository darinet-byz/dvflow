name: Deploy WA cron worker

# Worker terpisah karena Cloudflare Pages tidak punya cron trigger (Fitur 3.0).
# Workflow ini sengaja terpisah dari deploy Pages: kegagalan Worker tidak boleh
# menahan rilis aplikasi utama.
#
# MANUAL SAJA: token Cloudflare yang dipakai Pages belum tentu punya izin
# Workers Scripts:Edit (akun Worker saat ini berbeda dari akun Pages). Jalankan
# workflow ini hanya setelah `CLOUDFLARE_API_TOKEN` di repo memiliki izin
# tersebut; bila tidak, deploy lewat `npm run deploy:wa-cron` dengan akun OAuth
# yang berhak.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-wa-cron
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm -w @dvflow/wa-cron run typecheck
      - run: npm -w @dvflow/wa-cron test
      - name: Deploy worker
        run: npx --no-install wrangler deploy -c apps/wa-cron/wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
